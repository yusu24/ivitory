<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="mBgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F2" />
      <stop offset="100%" stop-color="#FAF5EE" />
    </linearGradient>

    <linearGradient id="mTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="mBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <linearGradient id="mCardPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>

    <filter id="mSoftShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>

    <filter id="mCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B0764" flood-opacity="0.08" />
    </filter>

    <filter id="mBlurBlob" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .font-sans { font-family: 'Plus Jakarta Sans', Inter, -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>

  <!-- Background -->
  <g id="Mobile-Background">
    <rect width="390" height="844" fill="url(#mBgCanvas)" />
    
    <g id="Mobile-Glow" filter="url(#mBlurBlob)">
      <circle cx="60" cy="100" r="140" fill="#FFE1E1" opacity="0.8" />
      <circle cx="340" cy="700" r="160" fill="#E2EAFB" opacity="0.75" />
      <circle cx="320" cy="220" r="100" fill="#FDFCF0" opacity="0.7" />
    </g>
  </g>

  <!-- Mobile Header / Navbar -->
  <g id="Mobile-Navbar" class="font-sans" transform="translate(16, 16)">
    <rect width="358" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.7" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.2" filter="url(#mSoftShadow)" />
    
    <!-- Brand -->
    <g id="Brand" transform="translate(16, 11)">
      <circle cx="15" cy="15" r="14" fill="url(#mBrandGrad)" />
      <path d="M15 9 L16.5 13 L20.5 14.5 L16.5 16 L15 20 L13.5 16 L9.5 14.5 L13.5 13 Z" fill="#FFFFFF" />
      <text x="36" y="20" font-size="16" font-weight="800" fill="#0F172A">Invitory</text>
    </g>

    <!-- Menu Hamburger -->
    <g id="Menu-Btn" transform="translate(305, 14)">
      <rect x="0" y="0" width="36" height="24" rx="6" fill="#F1F5F9" />
      <line x1="8" y1="7" x2="28" y2="7" stroke="#334155" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="12" x2="28" y2="12" stroke="#334155" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="17" x2="28" y2="17" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Mobile Hero Content -->
  <g id="Mobile-Hero" class="font-sans" text-anchor="middle">
    <!-- Category Pill -->
    <g id="Category-Pill" transform="translate(195, 96)">
      <rect x="-140" y="0" width="280" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.65" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="-118" cy="14" r="3.5" fill="#A855F7" />
      <text x="-105" y="18" text-anchor="start" font-size="9" font-weight="800" fill="#475569" letter-spacing="1.2">PLATFORM UNDANGAN DIGITAL #1</text>
    </g>

    <!-- Main Title -->
    <g id="Title">
      <text x="195" y="165" class="font-serif" font-style="italic" font-size="44" fill="#1E293B" letter-spacing="-1">Your Story,</text>
      <text x="195" y="212" font-size="42" font-weight="900" fill="url(#mTextGrad)" letter-spacing="-1.5">Beautifully Shared.</text>
    </g>

    <!-- Subtitle -->
    <g id="Subtitle" fill="#475569" font-size="13" font-weight="400">
      <text x="195" y="248">Buat undangan digital pernikahan &amp; momen istimewa</text>
      <text x="195" y="268">yang <tspan font-weight="700" fill="#581C87">elegan, interaktif,</tspan> dan siap disebar dalam 5 menit.</text>
    </g>

    <!-- CTA Stack -->
    <g id="CTA-Buttons" transform="translate(20, 296)">
      <!-- Primary -->
      <g id="Btn-Primary">
        <rect x="0" y="0" width="350" height="48" rx="16" fill="#0F172A" />
        <text x="175" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Mulai Desain Undangan ➔</text>
      </g>
      
      <!-- Secondary -->
      <g id="Btn-Secondary" transform="translate(0, 56)">
        <rect x="0" y="0" width="350" height="46" rx="16" fill="#FFFFFF" fill-opacity="0.7" stroke="#FFFFFF" stroke-width="1" />
        <text x="175" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">▶ Lihat Demo Interactive</text>
      </g>
    </g>
  </g>

  <!-- Mobile Featured Theme Card -->
  <g id="Mobile-Featured-Card" class="font-sans" transform="translate(20, 420)">
    <rect width="350" height="220" rx="24" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.5" filter="url(#mCardShadow)" />
    
    <g transform="translate(20, 24)">
      <!-- Badge -->
      <g>
        <rect x="0" y="0" width="135" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.7" stroke="#FFFFFF" stroke-width="1" />
        <text x="10" y="15" font-size="8.5" font-weight="800" fill="#334155" letter-spacing="0.8">FEATURED THEME 2026</text>
      </g>

      <text x="0" y="52" class="font-serif" font-style="italic" font-size="22" font-weight="700" fill="#1E293B">The Ethereal Garden</text>
      <text x="0" y="74" font-size="11.5" font-weight="400" fill="#475569">Tema floral transparan dengan musik &amp; RSVP otomatis.</text>

      <!-- Mini Card Preview embedded -->
      <g transform="translate(0, 92)">
        <rect width="310" height="78" rx="14" fill="url(#mCardPink)" stroke="#FFFFFF" stroke-width="1" />
        <circle cx="28" cy="28" r="14" fill="#FFFFFF" fill-opacity="0.8" />
        <text x="21" y="33" font-size="13">💐</text>
        <text x="52" y="24" font-size="9" font-weight="800" fill="#9F1239" letter-spacing="0.8">PERNIKAHAN</text>
        <text x="52" y="42" class="font-serif" font-size="14" font-weight="700" fill="#1E293B">Rian &amp; Anindya</text>
        
        <rect x="225" y="24" width="70" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.8" />
        <text x="260" y="43" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Preview</text>
      </g>
    </g>
  </g>

  <!-- Mobile Stats Bar -->
  <g id="Mobile-Stats-Grid" class="font-sans" transform="translate(20, 660)">
    <rect width="350" height="150" rx="20" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="1.2" filter="url(#mSoftShadow)" />
    
    <!-- 2x2 Grid -->
    <g transform="translate(20, 20)">
      <!-- Item 1 -->
      <g>
        <text x="0" y="22" font-size="22" font-weight="900" fill="#1E293B">15,000+</text>
        <text x="0" y="40" font-size="9.5" font-weight="800" fill="#64748B" letter-spacing="0.8">UNDANGAN TERBUAT</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(170, 0)">
        <text x="0" y="22" font-size="22" font-weight="900" fill="#1E293B">4.9 ★</text>
        <text x="0" y="40" font-size="9.5" font-weight="800" fill="#64748B" letter-spacing="0.8">KEPUASAN PENGGUNA</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 65)">
        <text x="0" y="22" font-size="22" font-weight="900" fill="#1E293B">5 Menit</text>
        <text x="0" y="40" font-size="9.5" font-weight="800" fill="#64748B" letter-spacing="0.8">PROSES CEPAT</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(170, 65)">
        <text x="0" y="22" font-size="22" font-weight="900" fill="#047857">100% 🛡</text>
        <text x="0" y="40" font-size="9.5" font-weight="800" fill="#64748B" letter-spacing="0.8">AMAN &amp; TANPA IKLAN</text>
      </g>
    </g>
  </g>
</svg>
